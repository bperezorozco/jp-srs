<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kotonoha 言の葉</title>
  <style>
    body {
      font-family: -apple-system, sans-serif;
      max-width: 480px;
      margin: 40px auto;
      padding: 0 20px;
    }
    input[type=text] {
      width: 100%;
      font-size: 1.5rem;
      padding: 12px;
      box-sizing: border-box;
    }
    .options {
      display: flex;
      gap: 10px;
      margin-top: 10px;
    }
    .options select {
      flex: 1;
      font-size: 1rem;
      padding: 10px;
    }
    button {
      width: 100%;
      font-size: 1.1rem;
      padding: 12px;
      margin-top: 10px;
    }
    .card {
      margin-top: 24px;
      padding: 16px;
      border: 1px solid #ccc;
      border-radius: 8px;
      display: none;
    }
    .sentence { font-size: 1.4rem; margin-bottom: 8px; }
    .furigana { color: #666; font-size: 0.95rem; margin-bottom: 8px; }
    .translation { margin-bottom: 8px; }
    .note { font-size: 0.9rem; color: #444; font-style: italic; }
    .error { color: #c00; margin-top: 16px; }
    .header { text-align: center; margin-bottom: 20px; }
    .header h1 { margin: 0; font-size: 1.6rem; }
    .headline { color: #666; font-size: 0.9rem; margin-top: 4px; }
    .poem {
      display: flex;
      gap: 20px;
      margin-bottom: 24px;
    }
    .poem-col {
      flex: 1;
      font-size: 0.9rem;
      font-style: italic;
      color: #555;
      line-height: 1.6;
      text-align: center;
    }
  </style>
</head>
<body>
  <div class="header">
    <h1>Kotonoha 言の葉</h1>
    <div class="headline" id="headline"></div>
  </div>
  <div class="poem">
    <div class="poem-col">言の葉や<br>一つひとつ<br>心に降る</div>
    <div class="poem-col" id="poem-translated"></div>
  </div>
  <input type="text" id="word" placeholder="単語を入力" autofocus>
  <div class="options">
    <select id="level">
      <option value="N5" selected>N5</option>
      <option value="N4">N4</option>
      <option value="N3">N3</option>
      <option value="N2">N2</option>
      <option value="N1">N1</option>
    </select>
    <select id="language">
      <option value="es" selected>Español (México)</option>
      <option value="en">English (UK)</option>
      <option value="it">Italiano (Italia)</option>
      <option value="fr">Français (France)</option>
    </select>
  </div>
  <button id="go">GO!</button>

  <div class="card" id="card">
    <div class="sentence" id="sentence"></div>
    <div class="furigana" id="furigana"></div>
    <div class="translation" id="translation"></div>
    <div class="note" id="note"></div>
  </div>
  <div class="error" id="error"></div>

  <script>
    const TAGLINES = {
      es: {
        verse: ["hoja tras hoja,", "las palabras se posan", "y florecen"],
        headline: "Tu compañero personalizado para vocabulario a tu propio nivel",
      },
      en: {
        verse: ["leaf by leaf,", "words settle", "and bloom"],
        headline: "Your personalised companion for vocabulary at your own level",
      },
      it: {
        verse: ["foglia dopo foglia,", "le parole si posano", "e fioriscono"],
        headline: "Il tuo compagno personalizzato per il vocabolario al tuo livello",
      },
      fr: {
        verse: ["feuille après feuille,", "les mots se posent", "et fleurissent"],
        headline: "Votre compagnon personnalisé pour le vocabulaire à votre niveau",
      },
    };

    const HEADLINE_JA = "あなたのレベルに合わせた、パーソナル語彙学習パートナー";

    const LEVEL_LABELS = {
      es: { N5: "Principiante", N4: "Elemental", N3: "Intermedio", N2: "Intermedio Alto", N1: "Avanzado" },
      en: { N5: "Beginner", N4: "Elementary", N3: "Intermediate", N2: "Upper Intermediate", N1: "Advanced" },
      it: { N5: "Principiante", N4: "Elementare", N3: "Intermedio", N2: "Intermedio Avanzato", N1: "Avanzato" },
      fr: { N5: "Débutant", N4: "Élémentaire", N3: "Intermédiaire", N2: "Intermédiaire Supérieur", N1: "Avancé" },
    };

    function updateTagline() {
      const language = document.getElementById("language").value;
      const tagline = TAGLINES[language];
      document.getElementById("headline").innerHTML = `${HEADLINE_JA}<br>${tagline.headline}`;
      document.getElementById("poem-translated").innerHTML = tagline.verse.join("<br>");

      const levels = LEVEL_LABELS[language];
      for (const option of document.getElementById("level").options) {
        option.textContent = `${option.value} - ${levels[option.value]}`;
      }
    }

    function getSecret() {
      let secret = localStorage.getItem("appSecret");
      if (!secret) {
        secret = prompt("Ingresa el secreto de la app:");
        if (secret) localStorage.setItem("appSecret", secret);
      }
      return secret;
    }

    async function generate() {
      const word = document.getElementById("word").value.trim();
      const errorEl = document.getElementById("error");
      const cardEl = document.getElementById("card");
      errorEl.textContent = "";
      cardEl.style.display = "none";

      if (!word) return;

      const secret = getSecret();
      if (!secret) return;

      const level = document.getElementById("level").value;
      const language = document.getElementById("language").value;

      try {
        const res = await fetch(
          `/sentence?word=${encodeURIComponent(word)}&level=${encodeURIComponent(level)}&language=${encodeURIComponent(language)}`,
          { headers: { "X-App-Secret": secret } }
        );

        if (res.status === 401) {
          localStorage.removeItem("appSecret");
          errorEl.textContent = "Secreto incorrecto, intenta de nuevo.";
          return;
        }
        if (!res.ok) {
          errorEl.textContent = `Error del servidor (${res.status})`;
          return;
        }

        const data = await res.json();
        document.getElementById("sentence").textContent = data.sentence;
        document.getElementById("furigana").textContent = data.furigana;
        document.getElementById("translation").textContent = data.translation;
        document.getElementById("note").textContent = data.note || "";
        cardEl.style.display = "block";
      } catch (e) {
        errorEl.textContent = "No se pudo conectar al servidor.";
      }
    }

    function initLanguageFromUrl() {
      const params = new URLSearchParams(window.location.search);
      const lang = params.get("lang");
      if (lang && TAGLINES[lang]) {
        document.getElementById("language").value = lang;
      }
    }

    function onLanguageChange() {
      const language = document.getElementById("language").value;
      const url = new URL(window.location);
      url.searchParams.set("lang", language);
      history.replaceState(null, "", url);
      updateTagline();
    }

    document.getElementById("go").addEventListener("click", generate);
    document.getElementById("word").addEventListener("keydown", (e) => {
      if (e.key === "Enter") generate();
    });
    document.getElementById("language").addEventListener("change", onLanguageChange);
    initLanguageFromUrl();
    updateTagline();
  </script>
</body>
</html>
