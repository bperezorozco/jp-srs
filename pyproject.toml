[project]
name = "jp-srs"
version = "0.1.0"
description = "JLPT N2 vocabulary app with LLM-generated sentences and SRS"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "anthropic>=0.40.0",
    "fastapi>=0.141.1",
    "httpx>=0.28.1",
    "python-dotenv>=1.2.2",
    "uvicorn>=0.52.1",
]

[dependency-groups]
dev = [
    "claude-agent-sdk>=0.2.128",
]

[tool.uv]
package = false

